server:
  port: 8091

spring:
  application:
    name: lind-qps-checker
  datasource:
    url: jdbc:mysql://localhost:3306/lind_qps?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  # 表结构改由 Liquibase 管理，不再使用 spring.sql.init
  sql:
    init:
      mode: never
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  freemarker:
    cache: false
    suffix: .ftl
    content-type: text/html
    charset: UTF-8
    settings:
      number_format: computer

logging:
  level:
    com.lind.qps: INFO
    liquibase: INFO
