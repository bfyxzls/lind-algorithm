name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build package
        run: mvn -B -V clean package -DskipTests=false

      - name: Resolve artifact paths
        id: artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CORE="lind-algorithm/target/lind-algorithm-${VERSION}.jar"
          STREAM="lind-stream-web/target/lind-stream-web-${VERSION}.jar"
          if [[ ! -f "$CORE" ]]; then
            CORE="$(ls lind-algorithm/target/lind-algorithm-*.jar | grep -vE 'sources|javadoc|original' | head -n1)"
          fi
          if [[ ! -f "$STREAM" ]]; then
            STREAM="$(ls lind-stream-web/target/lind-stream-web-*.jar | grep -vE 'sources|javadoc|original' | head -n1)"
          fi
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "stream=$STREAM" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: lind-algorithm ${{ steps.artifact.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.core }}
            ${{ steps.artifact.outputs.stream }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
