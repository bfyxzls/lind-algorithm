name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build package
        run: mvn -B -V clean package -DskipTests=false

      - name: Resolve artifact paths
        id: artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CORE="lind-algorithm-framework/target/lind-algorithm-framework-${VERSION}.jar"
          FRAMELESS="lind-data-frameless/target/lind-data-frameless-${VERSION}.jar"
          STARTER="lind-data-starter/target/lind-data-starter-${VERSION}.jar"
          STREAM="lind-stream-web/target/lind-stream-web-${VERSION}.jar"
          DELAY="lind-delay-task-web/target/lind-delay-task-web-${VERSION}.jar"
          if [[ ! -f "$CORE" ]]; then
            CORE="$(ls lind-algorithm-framework/target/lind-algorithm-framework-*.jar | grep -vE 'sources|javadoc|original' | head -n1)"
          fi
          if [[ ! -f "$FRAMELESS" ]]; then
            FRAMELESS="$(ls lind-data-frameless/target/lind-data-frameless-*.jar | grep -vE 'sources|javadoc|original' | head -n1)"
          fi
          if [[ ! -f "$STARTER" ]]; then
            STARTER="$(ls lind-data-starter/target/lind-data-starter-*.jar | grep -vE 'sources|javadoc|original' | head -n1)"
          fi
          if [[ ! -f "$STREAM" ]]; then
            STREAM="$(ls lind-stream-web/target/lind-stream-web-*.jar | grep -vE 'sources|javadoc|original' | head -n1)"
          fi
          if [[ ! -f "$DELAY" ]]; then
            DELAY="$(ls lind-delay-task-web/target/lind-delay-task-web-*.jar | grep -vE 'sources|javadoc|original' | head -n1)"
          fi
          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "frameless=$FRAMELESS" >> "$GITHUB_OUTPUT"
          echo "starter=$STARTER" >> "$GITHUB_OUTPUT"
          echo "stream=$STREAM" >> "$GITHUB_OUTPUT"
          echo "delay=$DELAY" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: lind-algorithm ${{ steps.artifact.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.core }}
            ${{ steps.artifact.outputs.frameless }}
            ${{ steps.artifact.outputs.starter }}
            ${{ steps.artifact.outputs.stream }}
            ${{ steps.artifact.outputs.delay }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
